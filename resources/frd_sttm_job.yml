# Chains the four FRD->STTM notebooks (notebooks/01_frd_ingest.py ..
# 04_sttm_render.py) into one Databricks Job: ingest -> extract ->
# contract_build -> render. Manual/on-demand trigger only (no schedule) --
# see databricks.yml for the shared variables referenced below.
#
# Retries: job-level task retries are explicitly 0. 02_extract and
# 03_contract_build are designed to fail loudly on deterministic errors
# (schema violations, refusals, truncation) and only retry transient
# Anthropic API errors internally via the SDK client's own `max_retries`
# (a base_parameter passed to the notebook, unrelated to the task-level
# `max_retries: 0` below). Job-level retries would mask or double-retry
# failures the notebooks are already designed to surface.
#
# Compute: no job_cluster is defined anywhere in this file -- every task
# below has no cluster reference, which is what puts it on serverless
# compute, matching 02_extract's documented requirement.

resources:
  jobs:
    frd_sttm_pipeline:
      name: frd_sttm_pipeline

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: docs_table
          default: ${var.docs_table}
        - name: out_volume
          default: ${var.out_volume}
        - name: contracts_table
          default: ${var.contracts_table}
        # Run-shape knobs (literal defaults, not bundle variables, on
        # purpose): the defaults ARE the pipeline's normal shape, and the only
        # caller that overrides them is the review app's job-triggered demo
        # run, which passes run-scoped values (raw_volume=demo_raw/<suffix>,
        # suffixed table names, sharepoint_fetch_mode=skip) so a demo run can
        # never land on the curated volumes/tables -- the same insulation
        # guarantee the app's local subprocess mode enforces via env vars.
        - name: raw_volume
          default: frd_raw
        - name: runs_table
          default: frd_sttm_runs
        - name: sharepoint_fetch_mode
          default: fetch
        # SharePoint knobs for the fetch task. The client SECRET is
        # deliberately absent -- it resolves from the secret scope inside the
        # notebook, never from a job parameter. There is no output-folder
        # parameter because nothing in this repo writes to SharePoint (see
        # the note above the render task).
        - name: sharepoint_host
          default: ${var.sharepoint_host}
        - name: sharepoint_site_path
          default: ${var.sharepoint_site_path}
        - name: sharepoint_library
          default: ${var.sharepoint_library}
        - name: sharepoint_frd_folder
          default: ${var.sharepoint_frd_folder}
        - name: sharepoint_tenant_id
          default: ${var.sharepoint_tenant_id}
        - name: sharepoint_client_id
          default: ${var.sharepoint_client_id}

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        # Stage 00 pulls approved FRDs from the SharePoint library into
        # frd_raw. Kept a separate task, not folded into ingest, so a fetch
        # failure is distinguishable from a parse failure in the job graph and
        # 01-04 stay network-free. max_retries 0 matches every other task: a
        # 401/403 from Graph is a configuration error, not a transient one.
        - task_key: sharepoint_fetch
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/00_sharepoint_fetch.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              raw_volume: "{{job.parameters.raw_volume}}"
              sharepoint_fetch_mode: "{{job.parameters.sharepoint_fetch_mode}}"
              sharepoint_frd_folder: "{{job.parameters.sharepoint_frd_folder}}"
              sharepoint_host: "{{job.parameters.sharepoint_host}}"
              sharepoint_site_path: "{{job.parameters.sharepoint_site_path}}"
              sharepoint_library: "{{job.parameters.sharepoint_library}}"
              sharepoint_tenant_id: "{{job.parameters.sharepoint_tenant_id}}"
              sharepoint_client_id: "{{job.parameters.sharepoint_client_id}}"
              secret_scope: sttm_agent
              sharepoint_secret_key: sharepoint_client_secret

        - task_key: ingest
          depends_on:
            - task_key: sharepoint_fetch
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/01_frd_ingest.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              raw_volume: "{{job.parameters.raw_volume}}"
              table: "{{job.parameters.docs_table}}"
              preview_volume: "{{job.parameters.out_volume}}"

        - task_key: extract
          depends_on:
            - task_key: ingest
          # Job-level orchestration retries -- deliberately 0, so this layer
          # never masks or double-retries a deterministic failure (schema
          # violation, refusal, truncation) that 02_extract.py is designed to
          # surface. Not the same knob as the `max_retries: "2"` base_parameter
          # below: that one only controls the Anthropic SDK client's own
          # internal retries for transient API errors (429/5xx), handled
          # entirely inside the notebook. Same name, two different layers.
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/02_extract.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              docs_table: "{{job.parameters.docs_table}}"
              out_volume: "{{job.parameters.out_volume}}"
              model: claude-opus-4-8
              max_tokens: "16000"
              max_retries: "2"
              secret_scope: sttm_agent
              secret_key: anthropic_api_key

        - task_key: contract_build
          depends_on:
            - task_key: extract
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/03_contract_build.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              docs_table: "{{job.parameters.docs_table}}"
              contracts_table: "{{job.parameters.contracts_table}}"
              out_volume: "{{job.parameters.out_volume}}"

        # The job ends at render, DELIBERATELY. There is no publish task and
        # no publish code anywhere in the repo (2026-08-22; the former
        # 05_sharepoint_publish and the app's publish control were removed):
        # 04 re-runs every time a reviewer resolves an ambiguity, and a
        # rendered workbook is a DRAFT until a person has reviewed it. The
        # hand-off to SharePoint is that person uploading the finished
        # workbook to the library's STTM folder themselves; the scheduled
        # frd_sttm_sharepoint_sync job then pulls it into sttm_reference and
        # pairs it with its FRD. Do not add a publish task here.
        - task_key: render
          depends_on:
            - task_key: contract_build
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/04_sttm_render.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              contracts_table: "{{job.parameters.contracts_table}}"
              runs_table: "{{job.parameters.runs_table}}"
              reference_volume: sttm_reference
              out_volume: "{{job.parameters.out_volume}}"
