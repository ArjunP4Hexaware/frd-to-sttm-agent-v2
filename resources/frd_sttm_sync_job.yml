# The SharePoint SYNC job (decided 2026-08-22): keeps the frd_raw and
# sttm_reference volumes in step with the AmeriHealth SharePoint library and
# rebuilds the corpus index — notebooks/00_sharepoint_sync.py, one task.
#
# Why a separate, SCHEDULED job rather than a task in frd_sttm_pipeline:
# the pipeline runs when a person asks for a mapping (billed, per document);
# the sync runs whether or not anyone is using the app, so a newly approved
# FRD — or an STTM a reviewer uploaded after finishing it in the app — is
# in Databricks and paired before anyone looks. Zero model calls, so the
# schedule costs compute only. The review app's "Sync now" triggers THIS job
# via the Jobs API (backend/jobs_runner.py) — one implementation.
#
# Schedule: ${var.sync_cron} (Quartz, UTC), paused/unpaused per target via
# ${var.sync_schedule_pause_status}. The dev target PAUSES it (see
# databricks.yml): a dev workspace with no tenant wired would otherwise fail
# every tick and mail the notification address.
#
# Read scope only. The job never writes to SharePoint — see
# src/frdsttm/sharepoint.py. The client SECRET is deliberately absent from
# the parameters: it resolves from the secret scope inside the notebook.
#
# Compute: no job_cluster -> serverless, like frd_sttm_pipeline.

resources:
  jobs:
    frd_sttm_sharepoint_sync:
      name: frd_sttm_sharepoint_sync

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        # The REAL volumes, on purpose: the sync is the thing that maintains
        # them. (App-triggered pipeline runs use run-scoped sub-directories of
        # OTHER volumes and never touch these.)
        - name: raw_volume
          default: frd_raw
        - name: reference_volume
          default: sttm_reference
        # "sync" = list SharePoint, pull new/changed, drop departed, reindex.
        # "reindex" = rebuild the index from what the volumes already hold
        # (no network) — what the app's "Rebuild index" control passes.
        - name: sync_mode
          default: sync
        - name: sharepoint_host
          default: ${var.sharepoint_host}
        - name: sharepoint_site_path
          default: ${var.sharepoint_site_path}
        - name: sharepoint_library
          default: ${var.sharepoint_library}
        - name: sharepoint_frd_folder
          default: ${var.sharepoint_frd_folder}
        - name: sharepoint_reference_folder
          default: ${var.sharepoint_reference_folder}
        - name: sharepoint_tenant_id
          default: ${var.sharepoint_tenant_id}
        - name: sharepoint_client_id
          default: ${var.sharepoint_client_id}

      schedule:
        quartz_cron_expression: ${var.sync_cron}
        timezone_id: UTC
        pause_status: ${var.sync_schedule_pause_status}

      # One sync at a time: a slow tick must never overlap the next one and
      # race on the manifest/index files.
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${var.notification_email}

      tasks:
        - task_key: sharepoint_sync
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/00_sharepoint_sync.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              raw_volume: "{{job.parameters.raw_volume}}"
              reference_volume: "{{job.parameters.reference_volume}}"
              sync_mode: "{{job.parameters.sync_mode}}"
              sharepoint_host: "{{job.parameters.sharepoint_host}}"
              sharepoint_site_path: "{{job.parameters.sharepoint_site_path}}"
              sharepoint_library: "{{job.parameters.sharepoint_library}}"
              sharepoint_frd_folder: "{{job.parameters.sharepoint_frd_folder}}"
              sharepoint_reference_folder: "{{job.parameters.sharepoint_reference_folder}}"
              sharepoint_tenant_id: "{{job.parameters.sharepoint_tenant_id}}"
              sharepoint_client_id: "{{job.parameters.sharepoint_client_id}}"
              secret_scope: sttm_agent
              sharepoint_secret_key: sharepoint_client_secret
