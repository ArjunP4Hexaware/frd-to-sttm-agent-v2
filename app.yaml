# Databricks App manifest, per Databricks' documented app.yaml schema (command + env: docs.databricks.com/aws/en/
# dev-tools/databricks-apps/app-runtime) but a custom Python command, since
# this app is a FastAPI process (not one of the built-in Streamlit/Dash/
# Gradio Python app types) that also serves the frontend's built static
# assets -- see review_app_react/backend/app.py's StaticFiles mount.
# DATABRICKS_APP_PORT is injected by the platform at runtime; app.py reads it.
#
# LIVES AT THE REPO ROOT ON PURPOSE (moved 2026-08-22 evening): the App is
# deployed with `--source-code-path <workspace copy of THIS REPO>`, because
# the backend reaches outside review_app_react/ at startup (src/frdsttm via
# sharepoint_routes' sys.path bootstrap, notebooks/, local_dev_fixtures/).
# Apps installs the root requirements.txt, which includes
# review_app_react/requirements.txt -- that file stays the single manifest.
#
# Deploy prerequisite: `cd review_app_react/frontend && npm install && npm
# run build` first, so frontend/dist/ exists for app.py to serve. See
# review_app_react/README.md "Databricks Apps deployment".
command: ["python", "review_app_react/backend/app.py"]

# Live-run execution in this mode goes through the Jobs API (see
# review_app_react/backend/jobs_runner.py): the app triggers the bundle-deployed
# frd_sttm_pipeline job, so artifacts land natively in Unity Catalog and
# survive an App restart. The app syncs SharePoint -> Unity Catalog when it
# STARTS (and on "Sync now") by triggering the bundle-deployed
# frd_sttm_sharepoint_sync job the same way -- the job has no schedule of
# its own (decided 2026-08-22 late evening). STTM_SYNC_ON_STARTUP=0 turns
# the start-up sync off; STTM_FRD_NAME_PREFIX / STTM_STTM_NAME_PREFIX /
# STTM_VDD_NAME_PREFIX (default FRD_ / STTM_ / VDD_,DICT_) are the library's
# naming convention. STTM_SHAREPOINT_VDD_FOLDER is BLANK by default, which
# leaves the third input off; setting it turns dictionary sync on. Workspace
# prerequisites the deploy must verify:
#   - the three bundle jobs are deployed, and STTM_DEMO_JOB_NAME /
#     STTM_SYNC_JOB_NAME / STTM_RENDER_JOB_NAME below match their names AS
#     DEPLOYED (a dev-mode bundle target prefixes them, e.g.
#     "[dev <user>] frd_sttm_pipeline") -- or set the *_JOB_ID vars instead.
#     frd_sttm_render is the human-in-the-loop re-render (stage 04 only).
#   - volumes exist in CATALOG.SCHEMA: frd_raw + sttm_reference (the sync
#     maintains them; the app mirrors them down), demo_raw (per-run FRD
#     staging), sttm_out_app (per-run artifact sets), and -- since 2026-08-27
#     -- vdd_raw, the VENDOR DATA DICTIONARY volume (the third input),
#     named to sit beside frd_raw. vdd_raw is the one volume whose ABSENCE is tolerated: the mirror
#     degrades to "no vendor dictionaries yet", which is the state every FRD
#     is in today, rather than breaking the picker. Create it before anyone
#     relies on has_dictionary, or a real dictionary will look missing.
#   - secret scope sttm_agent/sharepoint_client_secret is populated.
#     sttm_agent/anthropic_api_key is NO LONGER REQUIRED (2026-08-24) while
#     sttm_llm_provider is "databricks" in resources/frd_sttm_job.yml -- that
#     path authenticates with the workspace credential and reads no Anthropic
#     key. It is required again the moment that parameter is set back to
#     "anthropic".
#   - the app's service principal can run both jobs, READ frd_raw and
#     sttm_reference, and read/write demo_raw and sttm_out_app
#   - GOVERNANCE (2026-08-23, docs/AI_GOVERNANCE.md): the audit volume
#     STTM_AUDIT_VOLUME exists (`bundle run frd_sttm_uc_governance` creates
#     and tags it) and the service principal has READ VOLUME + WRITE VOLUME
#     on it. Every governed action (run, resolution, re-render, workbook
#     download, sync, upload) writes one event file there BEFORE it
#     proceeds and FAILS (502) if it cannot. Every such action also needs
#     the caller's identity: Databricks Apps forwards it as
#     X-Forwarded-Email / -Preferred-Username / -User on every proxied
#     request; a request without them is refused (401). Only set
#     STTM_REQUIRE_IDENTITY=0 as a deliberate operator override (events are
#     then recorded under actor "unknown").
#   - ACCESS MODEL (2026-08-23): CAN USE on this App is granted to exactly
#     the group that may READ the agent's volumes (the client's BSAs) —
#     `bundle run frd_sttm_uc_governance --params reviewer_group=<Entra
#     group>,app_name=<this app's name>` does both. Nobody else gets CAN USE.
env:
  - name: "STTM_APP_MODE"
    value: "databricks"
  # Extraction provider (2026-08-24, Arjun). "databricks" serves the SAME
  # Claude models through this workspace's Foundation Model APIs, so nothing
  # needs an Anthropic key or the sttm_agent/anthropic_api_key secret scope:
  # the service principal authenticates and Databricks bills per token.
  #
  # READ THIS BEFORE CHANGING IT. A deployed App does NOT extract in this
  # container -- it triggers the bundle job (jobs_runner.py), so the values
  # that govern a live run are the base_parameters in
  # resources/frd_sttm_job.yml, NOT these. The two are set to the same thing
  # deliberately; change BOTH or the job silently wins. These entries cover
  # anything that ever does run in-container (the subprocess path, today
  # mock-only) and document the intent in the place people look first.
  - name: "STTM_LLM_PROVIDER"
    value: "databricks"
  # The most capable Claude available to Hexaware on Databricks. Resolves to
  # databricks-claude-opus-5 under the provider above (the databricks- prefix
  # is added automatically and printed in the run banner); the same id works
  # unchanged if the provider is switched back to "anthropic".
  - name: "MODEL"
    value: "claude-opus-5"
  - name: "CATALOG"
    value: "arjun_workspace"
  - name: "SCHEMA"
    value: "sttm_agent"
  - name: "OUT_VOLUME"
    value: "sttm_out"
  - name: "STTM_DEMO_JOB_NAME"
    value: "frd_sttm_pipeline"
  - name: "STTM_SYNC_JOB_NAME"
    value: "frd_sttm_sharepoint_sync"
  - name: "STTM_RENDER_JOB_NAME"
    value: "frd_sttm_render"
  # dev-target bundle deploys prefix job names (e.g. "[dev <user>]
  # frd_sttm_pipeline"), which the *_JOB_NAME values above won't match --
  # pin the ids from the dev deploy directly so name lookup is never
  # consulted. Re-pin these after any bundle deploy that recreates the
  # jobs (a fresh dev deploy under a different bundle run does NOT change
  # ids; `databricks bundle destroy` + redeploy would).
  - name: "STTM_DEMO_JOB_ID"
    value: "542994480165767"
  - name: "STTM_SYNC_JOB_ID"
    value: "892922030132384"
  - name: "STTM_RENDER_JOB_ID"
    value: "187243481553083"
  - name: "STTM_DEMO_APP_OUT_VOLUME"
    value: "sttm_out_app"
  # Governance: the append-only audit trail (one JSON per event under
  # events/). Identity is REQUIRED by default in databricks mode — see the
  # prerequisites comment above.
  - name: "STTM_AUDIT_VOLUME"
    value: "sttm_audit"
  # No SharePoint tenant is wired in this workspace (2026-08-27): the
  # start-up sync would trigger the sync JOB, which fails on the missing
  # tenant config and paints a red "Sync failed" box on the picker's first
  # screen. The corpus is already in the volumes; "Rebuild index" re-pairs
  # from them. Set to "1" once a tenant is configured.
  - name: "STTM_SYNC_ON_STARTUP"
    value: "0"
  # - name: "STTM_REQUIRE_IDENTITY"
  #   value: "0"                          # operator override ONLY
  # --- SharePoint (uncomment and fill once the Entra ID app registration
  # exists; until then the app shows "SharePoint is not connected").
  # The CLIENT SECRET must NOT be listed here as a value: map it from the
  # secret scope the notebooks already use (sttm_agent/sharepoint_client_secret)
  # via an Apps secret resource, e.g.:
  #   - name: "SHAREPOINT_CLIENT_SECRET"
  #     valueFrom: "sharepoint-client-secret"
  # - name: "SHAREPOINT_TENANT_ID"
  #   value: "<Entra directory (tenant) id>"
  # - name: "SHAREPOINT_CLIENT_ID"
  #   value: "<Entra application (client) id>"
  # - name: "SHAREPOINT_HOST"
  #   value: "<tenant>.sharepoint.com"
  # - name: "SHAREPOINT_SITE_PATH"
  #   value: "/sites/<SiteName>"          # must start with '/'
  # - name: "SHAREPOINT_LIBRARY"
  #   value: "Documents"                  # library DISPLAY name
  # - name: "SHAREPOINT_FRD_FOLDER"
  #   value: "FRDs"                       # "" = library root
  # Approved-STTM folder: the template library the sync pulls into
  # sttm_reference, and where a reviewer uploads a finished STTM. Defaults
  # to the FRD folder. There is no output folder: this app never writes to
  # SharePoint (2026-08-22).
  # - name: "SHAREPOINT_REFERENCE_FOLDER"
  #   value: "STTMs"
  # UC volume holding reference workbooks + corpus_index.json (default
  # sttm_reference — must match the jobs' reference_volume widget).
  # - name: "STTM_REFERENCE_VOLUME"
  #   value: "sttm_reference"
