# Databricks App manifest, per Databricks' documented app.yaml schema (command + env: docs.databricks.com/aws/en/
# dev-tools/databricks-apps/app-runtime) but a custom Python command, since
# this app is a FastAPI process (not one of the built-in Streamlit/Dash/
# Gradio Python app types) that also serves the frontend's built static
# assets -- see backend/app.py's StaticFiles mount. DATABRICKS_APP_PORT is
# injected by the platform at runtime; backend/app.py reads it directly.
#
# Deploy prerequisite: `cd frontend && npm install && npm run build` first,
# so frontend/dist/ exists for backend/app.py to serve. Not run here --
# this app is not being deployed this session (see README's Local mode /
# `databricks apps deploy` note).
command: ["python", "backend/app.py"]

# Live-run execution in this mode goes through the Jobs API (see
# backend/jobs_runner.py): the app triggers the bundle-deployed
# frd_sttm_pipeline job, so artifacts land natively in Unity Catalog and
# survive an App restart. Workspace prerequisites the deploy must verify:
#   - the bundle job is deployed, and STTM_DEMO_JOB_NAME below matches its
#     name AS DEPLOYED (a dev-mode bundle target prefixes it, e.g.
#     "[dev <user>] frd_sttm_pipeline") -- or set STTM_DEMO_JOB_ID instead
#   - volumes exist in CATALOG.SCHEMA: demo_raw (per-run FRD staging),
#     sttm_out_app (per-run artifact sets), sttm_reference holding at least
#     one reference workbook (stage 04 fails loudly on an empty one)
#   - secret scope sttm_agent/anthropic_api_key is populated
#   - the app's service principal can run the job and read/write the volumes
env:
  - name: "STTM_APP_MODE"
    value: "databricks"
  - name: "CATALOG"
    value: "soham_workspace"
  - name: "SCHEMA"
    value: "sttm_agent"
  - name: "OUT_VOLUME"
    value: "sttm_out"
  - name: "STTM_DEMO_JOB_NAME"
    value: "frd_sttm_pipeline"
  - name: "STTM_DEMO_APP_OUT_VOLUME"
    value: "sttm_out_app"
  # --- SharePoint (uncomment and fill once the Entra ID app registration
  # exists; until then the app shows "SharePoint is not connected").
  # The CLIENT SECRET must NOT be listed here as a value: map it from the
  # secret scope the notebooks already use (sttm_agent/sharepoint_client_secret)
  # via an Apps secret resource, e.g.:
  #   - name: "SHAREPOINT_CLIENT_SECRET"
  #     valueFrom: "sharepoint-client-secret"
  # - name: "SHAREPOINT_TENANT_ID"
  #   value: "<Entra directory (tenant) id>"
  # - name: "SHAREPOINT_CLIENT_ID"
  #   value: "<Entra application (client) id>"
  # - name: "SHAREPOINT_HOST"
  #   value: "<tenant>.sharepoint.com"
  # - name: "SHAREPOINT_SITE_PATH"
  #   value: "/sites/<SiteName>"          # must start with '/'
  # - name: "SHAREPOINT_LIBRARY"
  #   value: "Documents"                  # library DISPLAY name
  # - name: "SHAREPOINT_FRD_FOLDER"
  #   value: "FRDs"                       # "" = library root
  # - name: "SHAREPOINT_OUTPUT_FOLDER"
  #   value: "STTMs"                      # the ONLY folder this app writes
  # Reference-STTM folder for the corpus bootstrap (2026-08-22,
  # docs/TEMPLATE_ARCHITECTURE.md). Defaults to the FRD folder; deliberately
  # NOT the output folder — published output must never feed back in as
  # reference input.
  # - name: "SHAREPOINT_REFERENCE_FOLDER"
  #   value: "FRDs"
  # UC volume holding reference workbooks + corpus_index.json (default
  # sttm_reference — must match the job's reference_volume widget).
  # - name: "STTM_REFERENCE_VOLUME"
  #   value: "sttm_reference"
