<!doctype html>
<!-- `light` class: @databricks/appkit-ui's own stylesheet flips to its dark
     palette under `@media (prefers-color-scheme: dark) { :root:not(.light) {...} }`
     -- this is a light-only product surface, so the class is required (not
     just `color-scheme: light` in CSS, which only affects native form-control
     rendering, not that selector match). -->
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRD to STTM — Mapping Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
