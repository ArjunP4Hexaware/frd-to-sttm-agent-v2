bundle:
  name: frd_sttm_agent

include:
  - resources/*.yml

# Variables shared across the pipeline notebooks and the sync job
# (resources/frd_sttm_sync_job.yml). Defaults match the widget defaults
# hardcoded in notebooks/01_frd_ingest.py .. 04_sttm_render.py today
# (soham_workspace.sttm_agent). See resources/frd_sttm_job.yml for how
# each variable maps onto each notebook's actual widget names -- they don't
# all agree (e.g. 01_frd_ingest calls the shared documents table "table",
# while 02_extract/03_contract_build call it "docs_table").
variables:
  catalog:
    description: Unity Catalog catalog name, shared by all four notebooks.
    # DEV-WORKSPACE-ONLY default — soham_workspace exists only in the
    # internal dev workspace. Override per target; never assume it
    # resolves in the client workspace.
    default: soham_workspace
  schema:
    description: Unity Catalog schema name, shared by all four notebooks.
    # DEV-WORKSPACE-ONLY default (pairs with the catalog above).
    default: sttm_agent
  docs_table:
    description: >-
      Delta table holding parsed FRD documents. Written by 01_frd_ingest
      (widget name "table") and read by 02_extract and 03_contract_build
      (widget name "docs_table" in both) -- one table, two widget names.
    default: frd_documents
  out_volume:
    description: >-
      UC volume root for pipeline outputs (extractions/, contracts/,
      reports/, rendered/). Widget name "out_volume" in 02_extract,
      03_contract_build, and 04_sttm_render. Also fed into 01_frd_ingest's
      "preview_volume" widget, which writes optional debug markdown copies
      under the same volume (set to "" on that one task to skip).
    default: sttm_out
  contracts_table:
    description: >-
      Delta table for feed-level mapping contracts. Widget name
      "contracts_table" in both 03_contract_build (writes) and
      04_sttm_render (reads) -- names already agree here.
    default: frd_contracts
  sharepoint_host:
    description: >-
      SharePoint hostname, e.g. contoso.sharepoint.com. Widget name
      "sharepoint_host" in 00_sharepoint_sync and 00_sharepoint_fetch.
      NO DEFAULT: a blank tenant must fail loudly at load_config rather than
      reach Graph and return an opaque 400.
    default: ""
  sharepoint_site_path:
    description: >-
      Server-relative site path, MUST start with '/' (e.g. /sites/DataOffice).
      Graph addresses a site as {host}:{path}.
    default: ""
  sharepoint_library:
    description: Document library (drive) display name holding FRDs and STTMs.
    default: Documents
  sharepoint_frd_folder:
    description: >-
      Folder within the library holding approved FRDs (read by
      00_sharepoint_sync and 00_sharepoint_fetch). Blank means the library
      root.
    default: ""
  sharepoint_reference_folder:
    description: >-
      Folder within the library holding approved STTM workbooks -- the
      template library the sync pulls into sttm_reference, and the folder a
      reviewer uploads a finished STTM to (the next sync pairs it with its
      FRD). Blank means the same folder as the FRDs. There is NO output
      folder any more: this repo never writes to SharePoint (decided
      2026-08-22; the former 05_sharepoint_publish is gone), so the app
      registration needs a READ grant only.
    default: ""
  sync_cron:
    description: >-
      Quartz cron (UTC) for frd_sttm_sharepoint_sync -- how often the
      volumes are brought in step with SharePoint and the corpus re-paired.
      Every 15 minutes by default; a tick with nothing new downloads
      nothing (eTag/modified/size change detection).
    default: "0 0/15 * * * ?"
  sync_schedule_pause_status:
    description: >-
      UNPAUSED in a workspace with a wired tenant; PAUSED where there is
      none (the dev target overrides this), so an unconfigured sync does not
      fail every tick and mail the notification address.
    default: UNPAUSED
  sharepoint_tenant_id:
    description: Entra ID tenant id for the app registration (app-only auth).
    default: ""
  sharepoint_client_id:
    description: >-
      Entra ID application (client) id. The client SECRET is never a bundle
      variable -- it lives only in the secret scope sttm_agent/
      sharepoint_client_secret.
    default: ""
  notification_email:
    description: >-
      Email address notified on job failure. PLACEHOLDER — set a real
      team address (not a personal one) per target before deploying to a
      shared workspace.
    default: replace-me@example.com

targets:
  dev:
    mode: development
    default: true
    variables:
      # No tenant is wired in the dev workspace; trigger the sync by hand
      # (databricks bundle run frd_sttm_sharepoint_sync) or from the app.
      sync_schedule_pause_status: PAUSED
