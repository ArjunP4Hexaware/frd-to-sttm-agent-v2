bundle:
  name: frd_sttm_agent

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the sttm_agent schema.
    default: arjun_workspace
  schema:
    description: Schema with the four volumes (frds, vdds, reference_sttms, output_sttms).
    default: sttm_agent

targets:
  dev:
    mode: development
    default: true
